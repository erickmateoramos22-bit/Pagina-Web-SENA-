      <h1 class="h1-usuario"> 
        UNIRTE A STREET WISE<br>
        REGISTRARSE
    </h1>
<form action="registrar_proceso.php" method="POST">
      <table class="tabla-usuario">
         <tr>
            <td>
               Nombre
            </td>
            <td>
                <input class="buscador-usuario" type="text" name="first_name" required placeholder="Ejemplo: Juan">
            </td>
            </tr>
            <tr>
            <td>
               Apellido
            </td>
            <td>
                <input class="buscador-usuario" type="text" name="last_name" required placeholder="Ejemplo: Pérez">
            </td>
            </tr>
            <tr>
            <td>
               Correo
            </td>
            <td>
                <input class="buscador-usuario" type="email" name="email" required placeholder="Ejemplo: usuario@dominio.com">
            </td>
         </tr>
            <tr>
                <td>
                Contraseña
                </td>
                <td>
                    <input class="buscador-usuario" type="password" name="password" required placeholder="Mínimo 8 caracteres, incluye mayúscula, minúscula y número">
                </td>
            </tr>
                <tr>
                <td>
                    Telefono
                </td>
                <td>
                    <input class="buscador-usuario" type="text" name="phone" required placeholder="Ejemplo: 3001234567">
                </td>
                </tr>
        </table>
            <br>
            <button type="submit" class="boton-pagina-registrar">
    REGISTRAR
    </button>
    </form>
    <br>
